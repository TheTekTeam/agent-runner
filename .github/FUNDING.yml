# .github/FUNDING.yml

# Link to your custom funding page.
# Using the custom: field with an image URL is the most effective way
# to display a non-standard button (like our custom graphic with the logo).

custom:
  # The text that will appear next to your custom button/image.
  - title: "Support This Project"
    # Specify the URL where people can donate.
    url: "https://your-donation-page.com/support"
    # Link to the custom button image you have hosted.
    # Replace the placeholder URL below with the actual URL
    # of the hosted 'image_1.png' graphic.
    image: "https://YOUR_HOSTED_BUTTON_IMAGE_URL/custom_button.png"

# Optional standard platforms can still be used and will appear below.
# github: [your-github-username]
# patreon: [your-patreon-username]
# open_collective: [your-collective]
# ko_fi: [your-kofi-username]
# tidelift: [your-platform]/[your-package-name]
# community_bridge: [your-project-name]
# liberapay: [your-username]
# issuehunt: [your-username]
# otechie: [your-username]
# custom: [] # Keep as custom: above
