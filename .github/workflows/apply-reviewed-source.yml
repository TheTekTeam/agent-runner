name: Apply reviewed Agent Runner source

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-reviewed-source.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Ephemeral, already-expiring transfer URL; this workflow deletes itself after use.
      SOURCE_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-3044-81f4-a2f0-31c9590eabdc/raw?se=2026-07-20T20:10:18Z&sp=r&sv=2026-02-06&sr=b&scid=f38f0341-e3be-5d88-9725-bf38c1f52a0e&skoid=56822d8b-6cfd-42ed-a00d-1452dca42036&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-20T00:22:22Z&ske=2026-07-22T00:22:22Z&sks=b&skv=2026-02-06&sig=t3ARM4GLNX5OdNc2RQOec/NgnrwhrZ/5VHqCtwDw9KY%3D"
      EXPECTED_SOURCE_COMMIT: 4d19c27af1d7ed8626848d3ac6ed1f0c94867fbf
      TARGET_BRANCH: claude/standalone-runner-686
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - name: Download and verify reviewed source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/agent-runner-source /tmp/agent-runner-source.zip
          mkdir -p /tmp/agent-runner-source
          curl -fL --retry 3 --retry-delay 2 "$SOURCE_URL" -o /tmp/agent-runner-source.zip
          unzip -q /tmp/agent-runner-source.zip -d /tmp/agent-runner-source
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('/tmp/agent-runner-source')
          manifest = json.loads((root / 'MIGRATION-MANIFEST.json').read_text())
          expected = '4d19c27af1d7ed8626848d3ac6ed1f0c94867fbf'
          if manifest.get('sourceCommit') != expected:
              raise SystemExit(f"source commit mismatch: {manifest.get('sourceCommit')} != {expected}")
          files = manifest.get('files') or []
          if len(files) != 65:
              raise SystemExit(f'unexpected closure size: {len(files)}')
          for item in files:
              path = root / item['path']
              if not path.is_file():
                  raise SystemExit(f"missing artifact file: {item['path']}")
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != item['sha256']:
                  raise SystemExit(f"hash mismatch: {item['path']}")
          print(f"PASS: verified {len(files)} files from {expected}")
          PY
      - name: Apply source and provenance
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path

          source = Path('/tmp/agent-runner-source')
          target = Path.cwd()
          manifest = json.loads((source / 'MIGRATION-MANIFEST.json').read_text())
          for item in manifest['files']:
              src = source / item['path']
              dst = target / item['path']
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(src, dst)
              dst.chmod(0o755 if item.get('mode') == '100755' else 0o644)
          shutil.copyfile(source / 'MIGRATION-MANIFEST.json', target / 'MIGRATION-MANIFEST.json')
          (target / 'MIGRATION-MANIFEST.json').chmod(0o644)
          PY
            rm -f .github/workflows/apply-reviewed-source.yml
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git diff --cached --check
            git commit -m 'Import canonical runner implementation from ModelSpend'
            git push origin HEAD:"$TARGET_BRANCH"
          } > /tmp/agent-runner-apply.log 2>&1 || {
            cat /tmp/agent-runner-apply.log >&2
            exit 1
          }
          cat /tmp/agent-runner-apply.log
      - name: Upload apply diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-runner-apply-log
          path: /tmp/agent-runner-apply.log
          if-no-files-found: warn
          retention-days: 30
