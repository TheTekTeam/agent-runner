name: Apply #43 implementation

on:
  push:
    branches:
      - claude/dispatch-authority-43
    paths:
      - .github/workflows/temp-source-export.yml

permissions:
  contents: write

concurrency:
  group: apply-agent-runner-43
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor == 'gpcola'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/dispatch-authority-43
          fetch-depth: 0

      - name: Reassemble and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/tmp/ar43/part-* | base64 --decode > /tmp/ar43.patch.xz
          echo 'f03d3e58cc90d5163128ed573cad919a39af23833fc52910de08efbab450c2ea  /tmp/ar43.patch.xz' | sha256sum --check --strict
          xz --decompress --stdout /tmp/ar43.patch.xz > /tmp/ar43.patch
          git apply --check /tmp/ar43.patch

      - name: Apply implementation and remove transfer scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/ar43.patch
          rm -rf .github/tmp/ar43
          rm -f .github/workflows/temp-source-export.yml
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"

      - name: Commit final implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: make manager packets sole dispatch authority'
          git push origin HEAD:claude/dispatch-authority-43
