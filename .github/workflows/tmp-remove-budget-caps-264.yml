name: Temporary #264 budget-cap removal

on:
  push:
    branches:
      - codex/remove-subscription-budget-caps-264

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'

      - name: Inventory legacy budget-cap surfaces
        run: |
          echo '=== BEFORE: dollar-budget surfaces ==='
          git grep -nE 'maxBudgetUsd|max_budget_usd|CLAUDE_RUNNER_MAX_BUDGET_USD_PER_ATTEMPT|--max-budget-usd|budget-cap-exceeds-machine-policy|candidateEffectiveCost|candidateBudgetIdentity|managerBudgetOverride' -- . || true

      - name: Apply repository-wide subscription budget-cap removal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing expected text: {label}')
              return text.replace(old, new)

          def must_sub(text, pattern, repl, label, count=1, flags=0):
              new, n = re.subn(pattern, repl, text, count=count, flags=flags)
              if n != count:
                  raise SystemExit(f'{label}: expected {count} substitutions, got {n}')
              return new

          # claude-runner.mjs: remove all active monetary cap semantics while
          # retaining model/effort escalation admission and historical result
          # classification for old recorded attempts.
          p = 'scripts/ops/claude-runner.mjs'
          s = read(p)
          s = re.sub(r"\n\s+maxBudgetUsd: '(?:0\.25|0\.50|1\.00|1\.50)',", '', s)
          s = must_sub(
              s,
              r"\nfunction positiveNumber\(value, fallback\) \{.*?\n\}\n\n/\*\*\n \* Fail-closed admission for an unattended paid Claude run\..*?\nexport function evaluateClaudeCostAdmission\(profile = \{\}, env = process\.env\) \{.*?\n\}\n\nexport function parseArgs",
              "\n/**\n * Fail-closed admission for unattended subscription-backed Claude controls.\n * Provider availability is governed exclusively by mandatory quota/headroom\n * admission elsewhere. This gate only protects explicit model/effort\n * escalation and contains no dollar-denominated execution limit.\n */\nexport function evaluateClaudeExecutionAdmission(profile = {}, env = process.env) {\n  const model = String(profile.model || '').trim().toLowerCase();\n  const effort = String(profile.effort || '').trim().toLowerCase();\n  const violations = [];\n\n  if (model.includes('opus') && !truthy(env.CLAUDE_RUNNER_ALLOW_OPUS)) {\n    violations.push('opus-requires-explicit-machine-opt-in');\n  }\n  if (['xhigh', 'max'].includes(effort) && !truthy(env.CLAUDE_RUNNER_ALLOW_XHIGH)) {\n    violations.push('high-effort-requires-explicit-machine-opt-in');\n  }\n\n  return {\n    allowed: violations.length === 0,\n    violations,\n    requested: {\n      model: profile.model || null,\n      effort: profile.effort || null,\n    },\n    policy: {\n      opusAllowed: truthy(env.CLAUDE_RUNNER_ALLOW_OPUS),\n      highEffortAllowed: truthy(env.CLAUDE_RUNNER_ALLOW_XHIGH),\n    },\n  };\n}\n\nexport function parseArgs",
              'replace Claude admission policy',
              flags=re.S,
          )
          s = s.replace('    maxBudgetUsd: undefined,\n', '')
          s = s.replace("    else if (arg === '--max-budget-usd') args.maxBudgetUsd = next();\n", '')
          s = s.replace('  --max-budget-usd <value>  Claude print-mode budget cap\n', '')
          s = must_sub(
              s,
              r"\n/\*\*\n \* Issue #223:.*?\nexport function resolveProfile",
              "\nexport function resolveProfile",
              'remove manager budget override compatibility seam',
              flags=re.S,
          )
          s = s.replace('    maxBudgetUsd: overrides.maxBudgetUsd || base.maxBudgetUsd,\n', '')
          s = s.replace('  argsMaxBudgetUsd,\n', '')
          s = s.replace('Profile/model/effort/max-budget must come from', 'Profile/model/effort must come from')
          s = s.replace("  const profile = resolveProfile(profileName, { model: args.model, effort: args.effort, maxBudgetUsd: args.maxBudgetUsd }, env);", "  const profile = resolveProfile(profileName, { model: args.model, effort: args.effort }, env);")
          s = s.replace("    costAdmission: evaluateClaudeCostAdmission(profile, env),", "    executionAdmission: evaluateClaudeExecutionAdmission(profile, env),")
          s = s.replace("  if (!runPlan.costAdmission?.allowed) {", "  if (!runPlan.executionAdmission?.allowed) {")
          s = s.replace("      reason: 'cost-policy-blocked',\n      failureReason: 'cost-policy-blocked',\n      message: 'The requested paid-agent controls exceed this machine\\'s unattended cost policy. No Claude process was started.',", "      reason: 'model-effort-policy-blocked',\n      failureReason: 'model-effort-policy-blocked',\n      message: 'The requested model/effort controls exceed this machine\\'s unattended policy. No Claude process was started.',")
          s = s.replace('after isolated-worktree, clean-commit, cost and permission-policy checks.', 'after isolated-worktree, clean-commit, model/effort and permission-policy checks.')
          s = s.replace('    argsEffort: args.effort, argsMaxBudgetUsd: args.maxBudgetUsd,', '    argsEffort: args.effort,')
          s = s.replace('    maxBudgetUsd: args.maxBudgetUsd || managerBudgetOverride(managerExecutionMeta.maxBudgetUsd),\n', '')
          s = s.replace('evaluateClaudeCostAdmission', 'evaluateClaudeExecutionAdmission')
          # COST_POLICY_EXIT_CODE remains numeric compatibility for callers, but
          # it now represents model/effort policy only; update visible wording.
          s = s.replace('Machine-local cost policy blocked the run before Claude started.', 'Machine-local model/effort policy blocked the run before Claude started.')
          s = s.replace('costAdmission:', 'executionAdmission:')
          write(p, s)

          # Shared adapter: no current adapter exposes or emits a monetary cap.
          p = 'scripts/ops/agent-runner-agents.mjs'
          s = read(p)
          s = s.replace('  maxBudgetUsd: { supported: false },\n', '')
          s = s.replace("      maxBudgetUsd: Object.freeze({ supported: true, flag: '--max-budget-usd' }),\n", '')
          s = s.replace('    maxBudgetUsd: profile.maxBudgetUsd,\n', '')
          s = must_sub(
              s,
              r"\n  // Implementation runs must be able to continue through discovery, edits,\n  // validation and commit\. Retain the legacy cap only for read-only plan mode\n  // until the remaining profile/config cleanup in #27 is completed\.\n  args\.push\(agent\.controls\.maxBudgetUsd\.flag, String\(profile\.maxBudgetUsd\)\);",
              "\n  // Subscription-backed Claude execution is deliberately uncapped in dollar\n  // terms. Mandatory quota/headroom admission remains the provider gate.",
              'remove shared Claude budget CLI flag',
              flags=re.S,
          )
          write(p, s)

          # Manager authority: legacy max_budget_usd remains tolerated as an
          # unknown/unused packet field for immutable historical compatibility,
          # but is no longer parsed into execution metadata.
          p = 'scripts/ops/agent-runner-manager-authority.mjs'
          s = read(p)
          s = must_sub(
              s,
              r"\nfunction rawScalarFromYamlBlock\(body, key\) \{.*?\n\}\n",
              '\n',
              'remove raw budget scalar helper',
              flags=re.S,
          )
          s = must_sub(
              s,
              r"\n/\*\*\n \* Issue #221: a canonical, quote-safe budget normalizer.*?\nexport function resolveManagerPreflightExecutionMetadata\(commentOrBody\) \{",
              "\n/**\n * Canonical resolver for execution scalars that can affect subscription-backed\n * Claude execution. Legacy `max_budget_usd` fields are intentionally ignored:\n * old immutable packets remain parseable, but dollar caps have no execution\n * semantics.\n */\nexport function resolveManagerPreflightExecutionMetadata(commentOrBody) {",
              'remove manager budget normalizer',
              flags=re.S,
          )
          s = s.replace("    maxBudgetUsd: normalizeManagerPreflightBudget(rawScalarFromYamlBlock(body, 'max_budget_usd')),\n", '')
          write(p, s)

          # Candidate admission: only model/effort escalation is a machine-profile
          # concern. Legacy manager budget fields do not participate.
          p = 'scripts/ops/agent-runner-candidate-admission.mjs'
          s = read(p)
          s = s.replace('  candidateEffectiveCostFingerprint,', '  candidateEffectiveProfileFingerprint,')
          s = s.replace('  evaluateClaudeCostAdmission,', '  evaluateClaudeExecutionAdmission,')
          s = s.replace('  managerBudgetOverride,\n', '')
          s = s.replace('    maxBudgetUsd: argsMaxBudgetUsd || managerBudgetOverride(managerExecutionMeta.maxBudgetUsd),\n', '')
          s = s.replace('  argsMaxBudgetUsd,\n', '')
          s = s.replace('  const costAdmission = evaluateClaudeCostAdmission(profile, env);', '  const executionAdmission = evaluateClaudeExecutionAdmission(profile, env);')
          s = s.replace('  if (!costAdmission.allowed) {', '  if (!executionAdmission.allowed) {')
          s = s.replace("      reason: 'candidate-machine-profile-cost-denied',", "      reason: 'candidate-machine-profile-policy-denied',")
          s = s.replace('      violations: costAdmission.violations,', '      violations: executionAdmission.violations,')
          s = s.replace("      safeNextAction: 'A changed manager intent/profile/budget requires a fresh superseding immutable manager-preflight authority; the existing packet must not be edited. Where permitted, use a separately authorised machine-local policy change for Opus/xhigh. This runner will not raise the machine cost ceiling automatically.',", "      safeNextAction: 'A changed manager intent/profile requires a fresh superseding immutable manager-preflight authority; the existing packet must not be edited. Where permitted, use a separately authorised machine-local policy change for Opus/xhigh.',")
          s = s.replace('      costAdmission,', '      executionAdmission,')
          s = s.replace('    costAdmission,', '    executionAdmission,')
          s = s.replace('export function evaluateCandidateCostAdmission', 'export function evaluateCandidateProfileAdmission')
          s = s.replace('  const effectiveFingerprint = candidateEffectiveCostFingerprint({', '  const effectiveFingerprint = candidateEffectiveProfileFingerprint({')
          s = s.replace('    costAdmission: decision.costAdmission,\n', '    executionAdmission: decision.executionAdmission,\n')
          s = s.replace('    managerMaxBudgetUsd: resolveManagerPreflightExecutionMetadata(preflight).maxBudgetUsd,\n', '')
          s = s.replace("      reason: admission.reason,", "      reason: admission.reason,")
          s = s.replace("      safeNextAction: 'Repair execution-critical status/agent labels or provide a current immutable manager preflight from an approved ChatGPT manager identity. Proceed or continue comments cannot authorize a new claim.',", "      safeNextAction: 'Repair execution-critical status/agent labels or provide a current immutable manager preflight from an approved ChatGPT manager identity. Proceed or continue comments cannot authorize a new claim.',")
          s = s.replace('function admitCandidateCost', 'function admitCandidateProfile')
          s = s.replace('  const cost = evaluateCandidateCostAdmission({', '  const profileAdmission = evaluateCandidateProfileAdmission({')
          s = s.replace('  if (cost.allowed) return identityAdmission;', '  if (profileAdmission.allowed) return identityAdmission;')
          s = s.replace('    reason: cost.decision.reason,', '    reason: profileAdmission.decision.reason,')
          s = s.replace('    violations: cost.decision.violations,', '    violations: profileAdmission.decision.violations,')
          s = s.replace('    safeNextAction: cost.decision.safeNextAction,', '    safeNextAction: profileAdmission.decision.safeNextAction,')
          s = s.replace('    effectiveFingerprint: cost.effectiveFingerprint,', '    effectiveFingerprint: profileAdmission.effectiveFingerprint,')
          s = s.replace('    occurrenceCount: cost.circuitResult.occurrenceCount,', '    occurrenceCount: profileAdmission.circuitResult.occurrenceCount,')
          s = s.replace('  const admission = admitCandidateCost({ identityAdmission, currentSelected, env });', '  const admission = admitCandidateProfile({ identityAdmission, currentSelected, env });')
          s = s.replace('candidate machine/profile cost decision', 'candidate machine/profile decision')
          s = s.replace('effort/max_budget_usd scalars', 'effort scalars')
          s = s.replace('no second cost policy', 'no second model/effort policy')
          s = s.replace('same cost gate', 'same model/effort gate')
          s = s.replace('candidate-effective cost', 'candidate-effective profile')
          write(p, s)

          # Candidate circuit: retain bounded dedupe for model/effort machine
          # policy refusals, with no budget identity or monetary policy material.
          p = 'scripts/ops/agent-runner-candidate-profile-circuit.mjs'
          s = read(p)
          s = s.replace("export const CANDIDATE_PROFILE_CIRCUIT_POLICY_REVISION = 'candidate-profile-cost-circuit/v1';", "export const CANDIDATE_PROFILE_CIRCUIT_POLICY_REVISION = 'candidate-profile-policy-circuit/v2';")
          s = must_sub(s, r"\nfunction finitePositiveNumber\(value\) \{.*?\n\}\n\nfunction canonicalNumber\(value\) \{.*?\n\}\n", '\n', 'remove circuit numeric budget helpers', flags=re.S)
          s = must_sub(s, r"\nexport function candidateBudgetIdentity\(.*?\n\}\n\nexport function candidateEffectiveCostFingerprintMaterial", '\nexport function candidateEffectiveProfileFingerprintMaterial', 'remove budget identity', flags=re.S)
          s = s.replace('  costAdmission = {},\n  managerMaxBudgetUsd = null,\n', '  executionAdmission = {},\n')
          s = must_sub(s, r"\n  const budgetIdentity = candidateBudgetIdentity\(\{.*?\n  \}\n", '\n', 'remove budget fingerprint material', flags=re.S)
          s = s.replace('      budgetIdentity,\n', '')
          s = must_sub(
              s,
              r"\n  const machineMaxBudgetUsd = canonicalNumber\(costAdmission\?\.policy\?\.maxBudgetUsd\);.*?\n  if \(typeof costAdmission\?\.policy\?\.highEffortAllowed !== 'boolean'\) \{\n    throw new Error\('costAdmission\.policy\.highEffortAllowed must be boolean'\);\n  \}",
              "\n  if (typeof executionAdmission?.policy?.opusAllowed !== 'boolean') {\n    throw new Error('executionAdmission.policy.opusAllowed must be boolean');\n  }\n  if (typeof executionAdmission?.policy?.highEffortAllowed !== 'boolean') {\n    throw new Error('executionAdmission.policy.highEffortAllowed must be boolean');\n  }",
              'replace circuit machine policy validation',
              flags=re.S,
          )
          s = s.replace('    machineCostPolicy: {\n      maxBudgetUsd: machineMaxBudgetUsd,\n      opusAllowed: costAdmission.policy.opusAllowed,\n      highEffortAllowed: costAdmission.policy.highEffortAllowed,\n    },', '    machineProfilePolicy: {\n      opusAllowed: executionAdmission.policy.opusAllowed,\n      highEffortAllowed: executionAdmission.policy.highEffortAllowed,\n    },')
          s = s.replace('export function candidateEffectiveCostFingerprint(input = {}) {\n  const material = candidateEffectiveCostFingerprintMaterial(input);', 'export function candidateEffectiveProfileFingerprint(input = {}) {\n  const material = candidateEffectiveProfileFingerprintMaterial(input);')
          s = s.replace('candidate cost fingerprinting', 'candidate profile fingerprinting')
          s = s.replace("safeNextAction: 'If manager intent/profile/budget changes, issue a fresh superseding immutable manager authority; do not edit the existing packet. If machine policy must change, require a separately authorised machine-local policy action. Never raise budget, enable Opus/xhigh, or enable paid fallback automatically.',", "safeNextAction: 'If manager intent/profile changes, issue a fresh superseding immutable manager authority; do not edit the existing packet. If machine policy must change, require a separately authorised machine-local Opus/xhigh policy action. Never enable paid fallback automatically.',")
          s = s.replace("safeNextAction: result.safeNextAction || 'Issue fresh immutable manager authority or separately authorise a machine-local policy change; never edit an existing packet or raise cost controls automatically.',", "safeNextAction: result.safeNextAction || 'Issue fresh immutable manager authority or separately authorise a machine-local model/effort policy change; never edit an existing packet.',")
          write(p, s)

          # Tests: update common fixtures to omit budget and assert uncapped CLI.
          p = 'scripts/ops/agent-runner-agents.test.mjs'
          s = read(p)
          s = re.sub(r",?\s*maxBudgetUsd: '[^']+'", '', s)
          s = s.replace("'--effort', 'medium', '--max-budget-usd', '1.50', '--permission-mode'", "'--effort', 'medium', '--permission-mode'")
          s = s.replace("'--effort', 'medium', '--max-budget-usd', '1.00', '--permission-mode'", "'--effort', 'medium', '--permission-mode'")
          s = s.replace("  assert.equal(args.includes('1'), false);\n", '')
          s = s.replace("test('read-only plan mode keeps current syntax and does not force dynamic-system-prompt exclusion'", "test('read-only plan mode is also uncapped and does not force dynamic-system-prompt exclusion'")
          s = s.replace("  assert.deepEqual(args.slice(0, -1), ['-p', '--model', 'sonnet', '--effort', 'medium', '--max-budget-usd', '1.00', '--permission-mode', 'plan', '--output-format', 'json']);", "  assert.deepEqual(args.slice(0, -1), ['-p', '--model', 'sonnet', '--effort', 'medium', '--permission-mode', 'plan', '--output-format', 'json']);\n  assert.equal(args.includes('--max-budget-usd'), false);")
          s = s.replace("  assert.equal(args.at(-1), 'hello');", "  assert.equal(args.includes('--max-budget-usd'), false);\n  assert.equal(args.at(-1), 'hello');")
          write(p, s)

          p = 'scripts/ops/agent-runner-manager-authority.test.mjs'
          s = read(p)
          s = must_sub(
              s,
              r"\ntest\('resolveManagerPreflightExecutionMetadata normalizes quoted and unquoted budgets identically'.*?\n\}\);\n$",
              "\n\ntest('legacy max_budget_usd packet fields remain parseable but are ignored by execution metadata', () => {\n  for (const legacy of [\n    'max_budget_usd: 1.00\\n',\n    'max_budget_usd: \\\"8.00\\\"\\n',\n    'max_budget_usd: not-a-number\\n',\n    'max_budget_usd: 0\\n',\n    'max_budget_usd: -1.00\\n',\n  ]) {\n    const packetValue = packetWithExecutionScalars(legacy);\n    assert.equal(parseManagerPreflightPacket(packetValue).valid, true);\n    const metadata = resolveManagerPreflightExecutionMetadata(packetValue);\n    assert.deepEqual(metadata, { profile: 'complex', model: 'sonnet', effort: 'medium' });\n    assert.equal(Object.hasOwn(metadata, 'maxBudgetUsd'), false);\n  }\n});\n",
              'replace manager budget normalization tests',
              flags=re.S,
          )
          write(p, s)

          p = 'scripts/ops/claude-runner.test.mjs'
          s = read(p)
          s = s.replace('  evaluateClaudeCostAdmission,\n', '  evaluateClaudeExecutionAdmission,\n')
          s = s.replace('  managerBudgetOverride,\n', '')
          s = s.replace('maxBudgetUsd: \'4.00\', ', '')
          s = re.sub(r",?\s*maxBudgetUsd: '[^']+'", '', s)
          s = s.replace("test('Claude args include model effort and budget without interaction caps'", "test('Claude args include model and effort without dollar or interaction caps'")
          s = s.replace("assert.deepEqual(args.slice(0, -1), ['-p', '--model', 'sonnet', '--effort', 'medium', '--max-budget-usd', '1.50', '--permission-mode', 'plan', '--output-format', 'json']);", "assert.deepEqual(args.slice(0, -1), ['-p', '--model', 'sonnet', '--effort', 'medium', '--permission-mode', 'plan', '--output-format', 'json']);\n  assert.equal(args.includes('--max-budget-usd'), false);")
          # Remove the old budget-admission/normalization test cluster while
          # preserving dispatch and later runtime tests. Replace it with an
          # explicit model/effort-only admission regression.
          s = must_sub(
              s,
              r"\ntest\('unattended cost admission rejects unapproved Opus.*?\ntest\('an absent manager budget still follows the existing profile-default semantics'.*?\n\}\);",
              "\n\ntest('subscription execution admission enforces model/effort escalation but never a dollar cap', () => {\n  const denied = evaluateClaudeExecutionAdmission({ model: 'opus', effort: 'xhigh' }, {});\n  assert.equal(denied.allowed, false);\n  assert.deepEqual(denied.violations, [\n    'opus-requires-explicit-machine-opt-in',\n    'high-effort-requires-explicit-machine-opt-in',\n  ]);\n  assert.equal(Object.hasOwn(denied.requested, 'maxBudgetUsd'), false);\n  assert.equal(Object.hasOwn(denied.policy, 'maxBudgetUsd'), false);\n\n  const allowed = evaluateClaudeExecutionAdmission({ model: 'sonnet', effort: 'medium' }, {\n    CLAUDE_RUNNER_MAX_BUDGET_USD_PER_ATTEMPT: '0.01',\n  });\n  assert.equal(allowed.allowed, true, 'legacy budget env must have no effect');\n});\n",
              'replace claude budget admission tests',
              flags=re.S,
          )
          # Legacy packet dispatch fixtures may still contain max_budget_usd;
          # execution metadata now ignores it. Remove tests asserting budget
          # normalization and retain one compatibility regression.
          s = must_sub(
              s,
              r"\ntest\('a quoted manager budget equal to the machine cap.*?\ntest\('an absent manager budget still follows the existing profile-default semantics'.*?\n\}\);",
              "\n\ntest('legacy manager budget fields cannot alter subscription execution profile resolution', () => {\n  for (const legacy of ['max_budget_usd: 1.00', 'max_budget_usd: \\\"8.00\\\"', 'max_budget_usd: not-a-number', 'max_budget_usd: 0', 'max_budget_usd: -1.00', '']) {\n    const dispatchIdentity = dispatchIdentityFor(legacy);\n    assert.equal(dispatchIdentity.ok, true, dispatchIdentity.failureReason || '');\n    assert.deepEqual(dispatchIdentity.managerExecutionMeta, { profile: 'complex', model: 'sonnet', effort: 'medium' });\n    const profile = resolveProfile(dispatchIdentity.profileName, {\n      model: dispatchIdentity.managerExecutionMeta.model,\n      effort: dispatchIdentity.managerExecutionMeta.effort,\n    });\n    assert.equal(Object.hasOwn(profile, 'maxBudgetUsd'), false);\n    assert.equal(evaluateClaudeExecutionAdmission(profile, { CLAUDE_RUNNER_MAX_BUDGET_USD_PER_ATTEMPT: '0.01' }).allowed, true);\n  }\n});\n",
              'replace dispatch budget tests',
              flags=re.S,
          )
          write(p, s)

          # Candidate admission and candidate circuit tests are rewritten only
          # in their budget-policy sections; identity/authority tests remain.
          p = 'scripts/ops/agent-runner-candidate-admission.test.mjs'
          s = read(p)
          s = s.replace('  evaluateCandidateCostAdmission,\n', '  evaluateCandidateProfileAdmission,\n')
          s = must_sub(
              s,
              r"\nfunction preflightWithBudget\(maxBudgetLine\) \{.*?\nfunction tmpCircuitDbPath\(\) \{",
              "\nfunction preflightWithLegacyBudget(maxBudgetLine, { model = 'sonnet', effort = 'low' } = {}) {\n  return {\n    body: `<!-- agent-runner:manager-preflight -->\\n\\n\\`\\`\\`yaml\\nschema_version: agent-runner-manager-preflight/v1\\nrevision: AR-264\\nfingerprint: sha256:${'0'.repeat(64)}\\nproducer_type: normal_chatgpt_manager_session\\napproved_agent: claude-code-cli\\nexecution_phase: implementation\\nprofile: narrow\\nmodel: ${model}\\neffort: ${effort}\\n${maxBudgetLine}\\nscope:\\n  - bounded test scope\\nrequired_validation:\\n  - node --test focused\\nstop_conditions:\\n  - stop on scope expansion\\n\\`\\`\\``,\n  };\n}\n\ntest('legacy manager budget values never influence candidate machine-profile admission', () => {\n  for (const legacy of ['max_budget_usd: \\\"1.00\\\"', 'max_budget_usd: \\\"8.00\\\"', 'max_budget_usd: not-a-number', 'max_budget_usd: 0', 'max_budget_usd: -1.00', '']) {\n    const decision = evaluateCandidateMachineProfileAdmission({\n      issue: { number: 5, title: 'narrow test issue', labels: [] },\n      preflight: preflightWithLegacyBudget(legacy),\n      env: { CLAUDE_RUNNER_MAX_BUDGET_USD_PER_ATTEMPT: '0.01' },\n    });\n    assert.equal(decision.allowed, true, legacy);\n    assert.equal(Object.hasOwn(decision.profile, 'maxBudgetUsd'), false);\n    assert.equal(Object.hasOwn(decision.executionAdmission.policy, 'maxBudgetUsd'), false);\n  }\n});\n\ntest('candidate machine-profile admission still requires explicit Opus/xhigh opt-ins', () => {\n  const denied = evaluateCandidateMachineProfileAdmission({\n    issue: { number: 5, title: 'narrow test issue', labels: [] },\n    preflight: preflightWithLegacyBudget('max_budget_usd: \\\"8.00\\\"', { model: 'opus', effort: 'xhigh' }),\n    env: {},\n  });\n  assert.equal(denied.allowed, false);\n  assert.deepEqual(denied.violations, ['opus-requires-explicit-machine-opt-in', 'high-effort-requires-explicit-machine-opt-in']);\n});\n\nfunction tmpCircuitDbPath() {",
              'replace candidate budget test cluster',
              flags=re.S,
          )
          # Remove later historical over-cap/circuit tests through the final
          # cost-admission pass-through test and add a policy-circuit test.
          s = must_sub(
              s,
              r"\nfunction selectionWithBudget\(.*?\ntest\('evaluateCandidateCostAdmission passes through machine-admitted candidates without touching the circuit'.*?\n\}\);",
