import { mkdtempSync, rmSync } from 'node:fs';
import { tmpdir } from 'node:os';
import { join } from 'node:path';
import test from 'node:test';

import {
  CandidateProfileCircuitBreaker,
  candidateEffectiveProfileFingerprint,
  candidateEffectiveProfileFingerprintMaterial,
  candidateProfileCircuitPausePayload,
} from './agent-runner-candidate-profile-circuit.mjs';

const FP_B = `sha256:${'b'.repeat(64)}`;

function authority({ revision = 'AR264.1', fingerprint = FP_B, packetDigest = `sha256:${'c'.repeat(64)}` } = {}) {
  return { authorityKey: `manager-preflight:${revision}:${fingerprint}`, revision, fingerprint, packetDigest };
}

function fixture(overrides = {}) {
  return {
    machineConfigurationFingerprint: `sha256:${'a'.repeat(64)}`,
    managerAuthority: authority(),
    profile: { profile: 'narrow', model: 'opus', effort: 'low' },
    executionAdmission: { policy: { opusAllowed: false, highEffortAllowed: false } },
    ...overrides,
  };
}

function withBreaker(run) {
  const dir = mkdtempSync(join(tmpdir(), 'agent-runner-candidate-profile-circuit-'));
  const dbPath = join(dir, 'circuit.sqlite');
  const breaker = new CandidateProfileCircuitBreaker(dbPath, { now: () => '2026-08-19T20:00:00.000Z' });
  try { return run(breaker); } finally { breaker.close(); rmSync(dir, { recursive: true, force: true }); }
}

test('candidate profile fingerprint contains no monetary budget material', () => {
  const material = candidateEffectiveProfileFingerprintMaterial(fixture());
  const serialized = JSON.stringify(material);
  assert.equal(/budget|maxBudget|usd/i.test(serialized), false);
  assert.deepEqual(material.resolvedProfile, { profile: 'narrow', model: 'opus', effort: 'low' });
  assert.deepEqual(material.machineProfilePolicy, { opusAllowed: false, highEffortAllowed: false });
});

test('manager authority and model/effort policy changes alter the effective profile fingerprint', () => {
  const baseline = candidateEffectiveProfileFingerprint(fixture());
  assert.notEqual(baseline, candidateEffectiveProfileFingerprint(fixture({ profile: { profile: 'narrow', model: 'sonnet', effort: 'low' } })));
  assert.notEqual(baseline, candidateEffectiveProfileFingerprint(fixture({ executionAdmission: { policy: { opusAllowed: true, highEffortAllowed: false } } })));
  assert.notEqual(baseline, candidateEffectiveProfileFingerprint(fixture({ managerAuthority: authority({ revision: 'AR264.2', fingerprint: `sha256:${'d'.repeat(64)}`, packetDigest: `sha256:${'e'.repeat(64)}` }) })));
});

test('fingerprint material remains positive-allowlisted and redaction-safe', () => {
  const enriched = fixture({
    managerAuthority: { ...authority(), body: 'TOP SECRET', token: 'secret-token' },
    profile: { profile: 'narrow', model: 'opus', effort: 'low', prompt: 'secret prompt', path: '/home/gp/private' },
    executionAdmission: { policy: { opusAllowed: false, highEffortAllowed: false }, providerOutput: 'secret output' },
  });
  const serialized = JSON.stringify(candidateEffectiveProfileFingerprintMaterial(enriched));
  for (const forbidden of ['TOP SECRET', 'secret-token', 'secret prompt', '/home/gp/private', 'secret output']) assert.equal(serialized.includes(forbidden), false);
});

test('one profile-policy refusal trips immediately and identical refusal dedupes', () => withBreaker((breaker) => {
  const fingerprint = candidateEffectiveProfileFingerprint(fixture());
  const first = breaker.record({ effectiveFingerprint: fingerprint, reason: 'candidate-machine-profile-policy-denied' });
  assert.equal(first.newlyTripped, true);
  assert.equal(first.occurrenceCount, 1);
  const second = breaker.record({ effectiveFingerprint: fingerprint, reason: 'candidate-machine-profile-policy-denied' });
  assert.equal(second.newlyTripped, false);
  assert.equal(second.occurrenceCount, 2);
  assert.equal(breaker.check({ effectiveFingerprint: fingerprint, reason: 'candidate-machine-profile-policy-denied' }).blocked, true);
}));

test('candidate circuit payload remains bounded and zero-side-effect', () => {
  const fingerprint = candidateEffectiveProfileFingerprint(fixture());
  const payload = candidateProfileCircuitPausePayload({ reason: 'candidate-machine-profile-policy-denied', effectiveFingerprint: fingerprint, occurrenceCount: 3 });
  assert.equal(payload.failureScope, 'machine_profile');
  assert.equal(payload.attemptCreated, false);
  assert.equal(payload.childLaunched, false);
  assert.equal(payload.issueMutation, false);
  assert.equal(payload.systemdOutcome, 'handled');
});
''')

