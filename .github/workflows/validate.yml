name: Validate Agent Runner

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-runner-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Agent Runner
    runs-on:
      - self-hosted
      - dev-cluster-dell
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0

      - name: Diagnose PR continuation binding input
        shell: bash
        run: node --test scripts/ops/agent-runner-pr-continuation-binding-input.test.mjs

      - name: Diagnose PR continuation binding
        if: always()
        shell: bash
        run: node --test scripts/ops/agent-runner-pr-continuation-binding.test.mjs

      - name: Diagnose PR continuation stability
        if: always()
        shell: bash
        run: node --test scripts/ops/agent-runner-pr-continuation-stability.test.mjs
