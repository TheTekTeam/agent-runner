name: Validate Agent Runner

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-runner-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Agent Runner
    runs-on:
      - self-hosted
      - dev-cluster-dell
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0

      - name: Diagnostic — agent-runner tests
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find scripts/ops -maxdepth 2 -type f -name 'agent-runner*.test.mjs' | sort)
          node --test "${tests[@]}"

      - name: Diagnostic — claude-runner tests
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find scripts/ops -maxdepth 2 -type f -name 'claude-runner*.test.mjs' | sort)
          node --test "${tests[@]}"

      - name: Diagnostic — installer tests
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find scripts/ops -maxdepth 2 -type f -name 'install-claude-runner*.test.mjs' | sort)
          node --test "${tests[@]}"

      - name: Run canonical repository validation
        run: npm run validate
