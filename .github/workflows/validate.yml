name: Validate Agent Runner

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck rsync
      - name: Validate repository
        shell: bash
        run: |
          set -o pipefail
          bash scripts/validate.sh > /tmp/agent-runner-validation.log 2>&1 || {
            tail -n 120 /tmp/agent-runner-validation.log >&2
            exit 1
          }
          cat /tmp/agent-runner-validation.log
      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-runner-validation-log
          path: /tmp/agent-runner-validation.log
