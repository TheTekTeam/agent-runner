name: Validate Agent Runner

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-runner-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Agent Runner
    runs-on:
      - self-hosted
      - dev-cluster-dell
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0

      - name: Diagnose Agent Runner tests M
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(scripts/ops/agent-runner-m*.test.mjs)
          ((${#tests[@]} == 0)) || node --test "${tests[@]}"

      - name: Diagnose Agent Runner tests N
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(scripts/ops/agent-runner-n*.test.mjs)
          ((${#tests[@]} == 0)) || node --test "${tests[@]}"

      - name: Diagnose Agent Runner tests O
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(scripts/ops/agent-runner-o*.test.mjs)
          ((${#tests[@]} == 0)) || node --test "${tests[@]}"

      - name: Diagnose Agent Runner tests P
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(scripts/ops/agent-runner-p*.test.mjs)
          ((${#tests[@]} == 0)) || node --test "${tests[@]}"

      - name: Diagnose Agent Runner tests Q-T
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(scripts/ops/agent-runner-[q-t]*.test.mjs)
          ((${#tests[@]} == 0)) || node --test "${tests[@]}"

      - name: Diagnose Agent Runner tests U-Z
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(scripts/ops/agent-runner-[u-z]*.test.mjs)
          ((${#tests[@]} == 0)) || node --test "${tests[@]}"
