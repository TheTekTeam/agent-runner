name: Validate Agent Runner

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-runner-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Agent Runner
    runs-on:
      - self-hosted
      - dev-cluster-dell
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0

      - name: Diagnose PR tests A-F
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(scripts/ops/agent-runner-pr-[a-f]*.test.mjs)
          ((${#tests[@]} == 0)) || node --test "${tests[@]}"

      - name: Diagnose PR tests G-O
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(scripts/ops/agent-runner-pr-[g-o]*.test.mjs)
          ((${#tests[@]} == 0)) || node --test "${tests[@]}"

      - name: Diagnose PR tests P-S
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(scripts/ops/agent-runner-pr-[p-s]*.test.mjs)
          ((${#tests[@]} == 0)) || node --test "${tests[@]}"

      - name: Diagnose PR tests T-Z
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(scripts/ops/agent-runner-pr-[t-z]*.test.mjs)
          ((${#tests[@]} == 0)) || node --test "${tests[@]}"
