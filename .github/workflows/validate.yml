name: Validate Agent Runner

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-runner-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Agent Runner
    runs-on:
      - self-hosted
      - dev-cluster-dell
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0

      - name: Diagnose PR continuation tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(scripts/ops/agent-runner-pr-conti*.test.mjs)
          ((${#tests[@]} == 0)) || node --test "${tests[@]}"

      - name: Diagnose PR contract controller tests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(scripts/ops/agent-runner-pr-contr*.test.mjs)
          ((${#tests[@]} == 0)) || node --test "${tests[@]}"

      - name: Diagnose remaining PR A-F tests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(scripts/ops/agent-runner-pr-[a-bd-f]*.test.mjs)
          ((${#tests[@]} == 0)) || node --test "${tests[@]}"
