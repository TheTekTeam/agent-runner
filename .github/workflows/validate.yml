name: Validate Agent Runner

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck rsync
      - name: Validate repository
        run: bash scripts/validate.sh
