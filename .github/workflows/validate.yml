name: Validate Agent Runner

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-runner-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Agent Runner
    runs-on:
      - self-hosted
      - dev-cluster-dell
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0

      - name: Diagnose compact prompt compiler tests
        run: node --test scripts/ops/claude-runner-prompt-compiler.test.mjs

      - name: Diagnose runner prompt compatibility tests
        run: node --test scripts/ops/claude-runner.test.mjs

      - name: Diagnose import provenance
        run: node scripts/verify-imported-tree.mjs

      - name: Diagnose remaining Claude runner tests
        shell: bash
        run: |
          mapfile -t tests < <(find scripts/ops -maxdepth 2 -type f -name 'claude-runner*.test.mjs' | sort)
          node --test "${tests[@]}"

      - name: Diagnose Agent Runner tests
        shell: bash
        run: |
          mapfile -t tests < <(find scripts/ops -maxdepth 2 -type f -name 'agent-runner*.test.mjs' | sort)
          node --test "${tests[@]}"

      - name: Run canonical repository validation
        run: npm run validate
