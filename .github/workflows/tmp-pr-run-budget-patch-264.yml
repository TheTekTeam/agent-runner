name: Temporary #264 PR patch runner

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'

      - name: Execute #264 repository patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/tmp-remove-budget-caps-264.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          indented = workflow[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in indented)
          exec(compile(code, '#264-embedded-patch', 'exec'), {'__name__': '__main__'})
          PY

      - name: Assert active dollar-cap surfaces are gone
        run: |
          if git grep -nE 'maxBudgetUsd|CLAUDE_RUNNER_MAX_BUDGET_USD_PER_ATTEMPT|--max-budget-usd|budget-cap-exceeds-machine-policy|managerBudgetOverride|candidateBudgetIdentity' -- scripts config; then
            echo 'ERROR: active budget-cap code remains under scripts/config' >&2
            exit 1
          fi
          echo 'Legacy max_budget_usd packet references retained only for compatibility:'
          git grep -n 'max_budget_usd' -- scripts config || true

      - name: Syntax checks
        run: |
          node --check scripts/ops/claude-runner.mjs
          node --check scripts/ops/agent-runner-agents.mjs
          node --check scripts/ops/agent-runner-manager-authority.mjs
          node --check scripts/ops/agent-runner-candidate-admission.mjs
          node --check scripts/ops/agent-runner-candidate-profile-circuit.mjs

      - name: Focused tests
        run: |
          node --test scripts/ops/agent-runner-agents.test.mjs
          node --test scripts/ops/agent-runner-manager-authority.test.mjs
          node --test scripts/ops/agent-runner-candidate-profile-circuit.test.mjs
          node --test scripts/ops/agent-runner-candidate-admission.test.mjs
          node --test scripts/ops/claude-runner.test.mjs

      - name: Full repository validation
        run: |
          npm test
          npm run validate
          git diff --check

      - name: Commit validated patch and remove temporary workflows
        run: |
          rm -f .github/workflows/tmp-remove-budget-caps-264.yml .github/workflows/tmp-pr-run-budget-patch-264.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'RUNNER.SUBSCRIPTION.BUDGET.CAP.REMOVAL.1 — remove Claude dollar caps (#264)'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
